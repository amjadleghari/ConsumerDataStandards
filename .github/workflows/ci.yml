name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate OpenAPI, overlays and Arazzo workflows
        run: npm run validate

      - name: Unit tests
        run: npm run test:unit

      - name: Build the site
        run: npm run build

      - name: Check that every Mermaid diagram renders
        run: npm run test:render
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 7
